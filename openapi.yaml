components:
  schemas:
    AppointmentSlotResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        starts_at:
          type: string
          format: date-time
          title: Starts At
        ends_at:
          type: string
          format: date-time
          title: Ends At
        available:
          type: integer
          minimum: 0.0
          title: Available
      type: object
      required:
      - id
      - starts_at
      - ends_at
      - available
      title: AppointmentSlotResponse
    BookingCreateRequest:
      properties:
        branch_id:
          type: string
          format: uuid
          title: Branch Id
        service_id:
          type: string
          format: uuid
          title: Service Id
        slot_id:
          type: string
          format: uuid
          title: Slot Id
      additionalProperties: false
      type: object
      required:
      - branch_id
      - service_id
      - slot_id
      title: BookingCreateRequest
    BranchQrResponse:
      properties:
        branch_id:
          type: string
          format: uuid
          title: Branch Id
        postal_code:
          type: string
          title: Postal Code
        join_url:
          type: string
          title: Join Url
        qr_svg_path:
          type: string
          title: Qr Svg Path
      type: object
      required:
      - branch_id
      - postal_code
      - join_url
      - qr_svg_path
      title: BranchQrResponse
    BranchResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        postal_code:
          type: string
          title: Postal Code
        name:
          type: string
          title: Name
        address:
          type: string
          title: Address
        timezone:
          type: string
          title: Timezone
      type: object
      required:
      - id
      - postal_code
      - name
      - address
      - timezone
      title: BranchResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthChecks:
      properties:
        database:
          type: string
          title: Database
        redis:
          type: string
          title: Redis
      type: object
      required:
      - database
      - redis
      title: HealthChecks
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
        checks:
          $ref: '#/components/schemas/HealthChecks'
      type: object
      required:
      - status
      - checks
      title: HealthResponse
    IncidentCreateRequest:
      properties:
        category:
          type: string
          enum:
          - technical
          - operational
          title: Category
        description:
          type: string
          maxLength: 1000
          minLength: 5
          title: Description
        window_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Window Id
        ticket_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Ticket Id
      additionalProperties: false
      type: object
      required:
      - category
      - description
      title: IncidentCreateRequest
    IncidentResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        category:
          type: string
          enum:
          - technical
          - operational
          title: Category
        description:
          type: string
          title: Description
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - category
      - description
      - created_at
      title: IncidentResponse
    QrJoinRequest:
      properties:
        branch_code:
          type: string
          pattern: ^\d{6}$
          title: Branch Code
        service_id:
          type: string
          format: uuid
          title: Service Id
      additionalProperties: false
      type: object
      required:
      - branch_code
      - service_id
      title: QrJoinRequest
    RedirectTicketRequest:
      properties:
        service_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Service Id
        target_window_id:
          anyOf:
          - type: string
